<!-- Тема: ui -->
<!-- Слой: B (условие: сопоставление имён переменных с CSS-свойствами) -->

<script>
window.UI_B = (function(){
  // Простая таблица: если имя начинается с X, то это CSS-свойство Y.
  // Если совпадения нет — используем имя как есть: var(--<name>).
  var MAP = [
    {test: /^bg/,           css: 'background'},
    {test: /^fg|^text/,     css: 'color'},
    {test: /^accent/,       css: 'accent'},
    {test: /^border/,       css: 'border-color'},
    {test: /^radius/,       css: 'border-radius'},
    {test: /^shadow/,       css: 'box-shadow'},
    {test: /^spacing|^gap/, css: 'gap'},
    {test: /^font/,         css: 'font'},
    {test: /^line/,         css: 'line-height'},
    {test: /^transition/,   css: 'transition'},
    {test: /^duration/,     css: 'transition-duration'}
  ];

  function describe(name){
    for(var i = 0; i < MAP.length; i++){
      if(MAP[i].test.test(name)) return MAP[i].css;
    }
    return 'custom';
  }

  function interpret(vars){
    // vars = { dark: {name: value}, light: {name: value} }
    var out = { dark: {}, light: {} };
    ['dark','light'].forEach(function(theme){
      var src = vars[theme] || {};
      Object.keys(src).forEach(function(name){
        out[theme][name] = {
          value: src[name],
          css: describe(name)
        };
      });
    });
    return out;
  }

  return { interpret: interpret, describe: describe };
})();
</script>
