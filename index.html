<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F8FA" />
<title>AI Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --text: #0A0B0D;
    --muted: #6B7280;
    --border: rgba(10, 11, 13, 0.08);
    --border-soft: rgba(10, 11, 13, 0.05);
    --accent: #1A1F36;
    --accent-soft: rgba(26, 31, 54, 0.08);
    --warning: #C68B3F;
    --critical: #B85450;
    --strategist: #4A6CF7;
    --analyst: #E07A5F;
    --shadow: 0 1px 3px rgba(10, 11, 13, 0.04), 0 4px 16px rgba(10, 11, 13, 0.04);
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Анимированный фон — бледнее */
  .bg-anim {
    position: fixed;
    inset: -10% 0 0 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.55;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
  }
  .bg-blob.a {
    width: 480px; height: 480px;
    background: rgba(74, 108, 247, 0.10);
    top: -80px; right: -120px;
    animation: floatA 26s ease-in-out infinite;
  }
  .bg-blob.b {
    width: 420px; height: 420px;
    background: rgba(224, 122, 95, 0.08);
    bottom: -80px; left: -100px;
    animation: floatB 30s ease-in-out infinite;
  }
  .bg-blob.c {
    width: 320px; height: 320px;
    background: rgba(26, 31, 54, 0.04);
    top: 40%; left: 40%;
    animation: floatC 34s ease-in-out infinite;
  }
  @keyframes floatA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.08); }
  }
  @keyframes floatB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.06); }
  }
  @keyframes floatC {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-20px, -40px) scale(0.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-blob { animation: none; }
  }

  /* Splash */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }
  .splash.hide { opacity: 0; pointer-events: none; }
  .splash-text {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--accent);
    animation: splashPulse 2s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.98); }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 12px;
  }

  /* Шапка с блюром — прозрачнее, с маской внизу */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(var(--safe-top) + 10px) 0 10px;
    margin: 0 -12px;
    padding-left: 12px;
    padding-right: 12px;
    background: rgba(247, 248, 250, 0.5);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    flex-shrink: 0;
    mask-image: linear-gradient(to bottom, black calc(100% - 12px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 12px), transparent 100%);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--border); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; stroke-width: 1.6; }
  .icon-btn.accent { color: var(--strategist); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 0 10px;
    height: 34px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    box-shadow: var(--shadow);
  }
  .chip:active { transform: scale(0.96); }
  .chip svg { width: 14px; height: 14px; color: var(--accent); stroke-width: 1.8; }
  .chip.warning svg { color: var(--warning); }
  .chip.critical svg { color: var(--critical); }
  .chip .value { font-variant-numeric: tabular-nums; }

  .lots-badge {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 0 9px;
    height: 34px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums;
  }
  .lots-badge.show { display: inline-flex; }
  .lots-badge.negative { color: var(--critical); }

  .reset-chip {
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(198, 139, 63, 0.12);
    border: 1px solid rgba(198, 139, 63, 0.28);
    color: var(--warning);
    padding: 0 10px;
    height: 34px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .reset-chip.show { display: inline-flex; }
  .reset-chip:active { transform: scale(0.96); }
  .reset-chip svg { width: 13px; height: 13px; }

  /* Chat */
  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 8px 0 16px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .row { display: flex; gap: 6px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }

  .avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    margin-left: -4px;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    background: transparent;
    border: none;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar.thinking { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.88; }
  }
  .avatar-label {
    font-size: 8.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }

  .row.user .bubble {
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 78%;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .row.agent .bubble {
    background: transparent;
    padding: 2px 0 30px;
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
  }

  .msg-actions {
    position: absolute;
    bottom: 0;
    right: 0;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .row.agent .bubble .msg-actions { opacity: 0.45; }
  .row.agent .bubble:hover .msg-actions { opacity: 1; }
  .msg-action {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .msg-action:hover { color: var(--accent); }
  .msg-action:active { transform: scale(0.92); }
  .msg-action.active { color: var(--warning); }
  .msg-action.active svg { fill: var(--warning); }
  .msg-action svg { width: 13px; height: 13px; stroke-width: 1.8; }

  .bubble h1, .bubble h2, .bubble h3 {
    margin: 12px 0 5px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 16px; }
  .bubble h2 { font-size: 15px; }
  .bubble h3 { font-size: 14px; }
  .bubble p { margin: 5px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 5px 0 5px 18px; }
  .bubble li { margin: 2px 0; }
  .bubble li::marker { color: var(--accent); }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .bubble blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin: 8px 0;
    color: var(--muted);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble code {
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.88em;
  }
  .bubble pre {
    background: #0A0B0D;
    color: #E8EAED;
    padding: 12px;
    padding-top: 34px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 10px 0;
    position: relative;
    font-size: 11.5px;
    line-height: 1.5;
  }
  .bubble pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .copy-code-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 10.5px;
    color: #E8EAED;
    cursor: pointer;
  }
  .copy-code-btn:active { transform: scale(0.95); }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  .bubble table thead { background: var(--surface-2); }
  .bubble table th, .bubble table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .bubble table th { font-weight: 600; font-size: 12.5px; }

  .typing { display: inline-flex; gap: 3px; align-items: center; padding: 2px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  .thinking-text {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-style: italic;
  }

  /* Attachments */
  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 2px 4px;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 200px;
    box-shadow: var(--shadow);
  }
  .attach-chip svg { width: 13px; height: 13px; color: var(--muted); flex-shrink: 0; }
  .attach-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .attach-chip .remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .attach-chip .remove:hover { color: var(--text); }

  /* Input — полупрозрачная плашка */
  .input-wrap {
    flex-shrink: 0;
    padding: 8px 0 calc(12px + var(--safe-bottom));
    position: sticky;
    bottom: 0;
  }
  .input-inner {
    display: flex;
    gap: 4px;
    align-items: center;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(10, 11, 13, 0.05);
    border-radius: 24px;
    padding: 4px 4px 4px 6px;
    box-shadow: 0 4px 20px rgba(10, 11, 13, 0.06);
    transition: border-color 0.2s, background 0.2s;
  }
  .input-inner:focus-within {
    border-color: rgba(10, 11, 13, 0.14);
    background: rgba(255, 255, 255, 0.7);
  }
  .attach-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  .attach-btn:hover { color: var(--accent); }
  .attach-btn:active { transform: scale(0.92); }
  .attach-btn svg { width: 17px; height: 17px; stroke-width: 1.8; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    max-height: 96px;
    min-height: 20px;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.2s, background 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 15px; height: 15px; stroke-width: 2.2; }

  /* Sheets */
  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 85dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 12px 18px calc(20px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 51;
    overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(10, 11, 13, 0.12);
    max-width: 700px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 32px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
    cursor: grab;
  }
  .sheet h3 { font-size: 14px; margin-bottom: 3px; font-weight: 600; letter-spacing: -0.02em; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

  /* Метрики — новая структура */
  .stability-ring {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4px 0 10px;
    position: relative;
  }
  .ring-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
  }
  .ring-fill.warning { stroke: var(--warning); }
  .ring-fill.critical { stroke: var(--critical); }
  .ring-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .ring-caption {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin-top: 4px;
  }

  .sparkline-wrap {
    padding: 8px 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 40px;
  }
  .spark-bar {
    width: 10px;
    background: var(--accent);
    border-radius: 3px;
    min-height: 4px;
    transition: height 0.3s, background 0.3s;
    opacity: 0.75;
  }
  .spark-bar.warning { background: var(--warning); }
  .spark-bar.critical { background: var(--critical); }
  .spark-bar.empty { background: var(--border); opacity: 0.5; }

  .metric-card {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .metric-card:hover { border-color: var(--border); }
  .metric-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .metric-card-label {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  .metric-card-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .metric-card-value.warning { color: var(--warning); }
  .metric-card-value.critical { color: var(--critical); }
  .metric-card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.2s;
    opacity: 0;
  }
  .metric-card.open .metric-card-body {
    max-height: 400px;
    margin-top: 10px;
    opacity: 1;
  }
  .metric-card-body p {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .metric-card-body p strong { color: var(--text); font-weight: 600; }

  .group-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 16px 0 8px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 0; }

  .report-btn {
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s, background 0.15s;
  }
  .report-btn:hover { background: var(--surface); }
  .report-btn:active { transform: scale(0.98); }
  .report-btn svg { width: 15px; height: 15px; }

  /* Passport */
  .passport-level {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 10.5px;
