<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F8FA" />
<title>Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --text: #0A0B0D;
    --muted: #6B7280;
    --border: rgba(10, 11, 13, 0.08);
    --accent: #1A1F36;
    --accent-soft: rgba(26, 31, 54, 0.08);
    --warning: #C68B3F;
    --critical: #B85450;
    --shadow: 0 1px 3px rgba(10, 11, 13, 0.04), 0 4px 16px rgba(10, 11, 13, 0.04);
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -100px 0 0 0;
    background: radial-gradient(700px 500px at 80% 0%, rgba(26, 31, 54, 0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(var(--safe-top) + 14px) 0 12px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
  }
  .brand svg { width: 20px; height: 20px; color: var(--accent); }

  .header-actions { display: flex; gap: 6px; align-items: center; }

  .stability-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px 5px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: var(--shadow);
  }
  .stability-chip:active { transform: scale(0.96); }
  .stability-bar {
    width: 28px; height: 3px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .stability-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s;
  }
  .stability-chip.warning .stability-fill { background: var(--warning); }
  .stability-chip.critical .stability-fill { background: var(--critical); }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; }

  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 6px 0 16px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .row.user { justify-content: flex-end; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    margin-top: 1px;
    overflow: hidden;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .avatar svg { width: 22px; height: 22px; display: block; }
  .avatar.analyst { color: var(--muted); }
  .avatar.thinking { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }

  .avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .avatar-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    opacity: 0;
    animation: fadeIn 0.4s 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Сообщения: пользователь — плашка, агент — без */
  .row.user .bubble {
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 78%;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .row.agent .bubble {
    background: transparent;
    padding: 2px 0 0;
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
  }

  /* Кнопка копирования сообщения */
  .msg-copy {
    position: absolute;
    top: 0;
    right: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .bubble:hover .msg-copy { opacity: 1; }
  .row.agent .bubble .msg-copy { opacity: 0.4; }
  .row.agent .bubble .msg-copy:hover { opacity: 1; color: var(--accent); }
  .msg-copy:active { transform: scale(0.92); }
  .msg-copy svg { width: 14px; height: 14px; }

  /* Кнопка "важное" */
  .msg-important {
    position: absolute;
    top: 0;
    right: 34px;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .row.agent .bubble .msg-important { opacity: 0.4; }
  .row.agent .bubble .msg-important:hover { opacity: 1; }
  .msg-important.active { color: var(--warning); opacity: 1; }
  .msg-important.active svg { fill: var(--warning); }
  .msg-important svg { width: 13px; height: 13px; }

  /* Markdown */
  .bubble h1, .bubble h2, .bubble h3 {
    margin: 14px 0 6px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 16px; }
  .bubble h2 { font-size: 15px; }
  .bubble h3 { font-size: 14px; }
  .bubble p { margin: 6px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
  .bubble li { margin: 3px 0; }
  .bubble li::marker { color: var(--accent); }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .bubble blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin: 8px 0;
    color: var(--muted);
  }
  .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  .bubble code {
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.88em;
  }
  .bubble pre {
    background: #0A0B0D;
    color: #E8EAED;
    padding: 12px;
    padding-top: 34px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 10px 0;
    position: relative;
    font-size: 12px;
    line-height: 1.55;
  }
  .bubble pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .copy-code-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 10.5px;
    color: #E8EAED;
    cursor: pointer;
  }
  .copy-code-btn:active { transform: scale(0.95); }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  .bubble table thead { background: var(--surface-2); }
  .bubble table th, .bubble table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .bubble table th { font-weight: 600; font-size: 12.5px; }

  /* Индикатор «думает» */
  .typing { display: inline-flex; gap: 3px; align-items: center; padding: 2px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  .thinking-text {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-style: italic;
  }

  /* Вложения */
  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 2px 4px;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 200px;
    box-shadow: var(--shadow);
  }
  .attach-chip svg { width: 13px; height: 13px; color: var(--muted); flex-shrink: 0; }
  .attach-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .attach-chip .remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .attach-chip .remove:hover { color: var(--text); }

  /* Input */
  .input-wrap {
    flex-shrink: 0;
    padding: 8px 0 calc(12px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    position: sticky;
    bottom: 0;
  }
  .input-inner {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 4px 4px 6px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  .attach-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  .attach-btn:hover { color: var(--accent); }
  .attach-btn:active { transform: scale(0.92); }
  .attach-btn svg { width: 18px; height: 18px; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    max-height: 110px;
    min-height: 22px;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  /* Sheet (метрики) */
  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 80dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 12px 20px calc(20px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 51;
    overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(10, 11, 13, 0.12);
    max-width: 700px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 32px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
    cursor: grab;
  }
  .sheet h3 { font-size: 14px; margin-bottom: 3px; font-weight: 600; letter-spacing: -0.02em; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .group-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 16px 0 6px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 0; }
  .metric {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .metric:last-child { border-bottom: none; }
  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .metric-row span:first-child { color: var(--muted); }
  .metric-row span:last-child { font-weight: 500; text-align: right; }
  .progress {
    height: 4px; border-radius: 2px;
    background: var(--border); overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s;
  }
  .progress-fill.warning { background: var(--warning); }
  .progress-fill.critical { background: var(--critical); }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 60;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + var(--safe-bottom));
    width: 100%;
    max-width: 700px;
    max-height: 90dvh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.02em; }
  .modal .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 5px;
    font-weight: 500;
  }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14px;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.2s, background 0.2s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .modal .check {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 12px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal .check input { width: 17px; height: 17px; accent-color: var(--accent); }

  .segmented {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-top: 5px;
  }
  .segmented button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(10, 11, 13, 0.06);
  }

  .modal .row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal button.action {
    flex: 1;
    padding: 12px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .modal button.action:active { transform: scale(0.97); }
  .modal .primary { background: var(--accent); color: #fff; }
  .modal .ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .modal .danger { background: var(--critical); color: #fff; }

  /* Частичный сброс — список сообщений */
  .reset-list {
    max-height: 40dvh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 10px;
  }
  .reset-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
  }
  .reset-item:last-child { border-bottom: none; }
  .reset-item input { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
  .reset-item .preview {
    flex: 1;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .reset-item .role {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(10, 11, 13, 0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 768px) {
    .sheet {
      left: 50%; right: auto;
      transform: translate(-50%, 100%);
      width: 580px;
      border-radius: 20px;
      bottom: 24px;
    }
    .sheet.open { transform: translate(-50%, 0); }
    .modal {
      border-radius: 20px;
      margin-bottom: 24px;
      width: 500px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
      Monolog
    </div>
    <div class="header-actions">
      <button class="stability-chip" id="stabilityChip" title="Метрики сессии">
        <span class="stability-bar"><span class="stability-fill" id="chipFill"></span></span>
        <span id="chipValue">—</span>
      </button>
      <button class="icon-btn" id="resetBtn" title="Управление контекстом">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
