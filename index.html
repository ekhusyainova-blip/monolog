<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --panel: rgba(255, 255, 255, 0.7);
    --accent: #f5c6c6;
    --accent-2: #f8d8c8;
    --shadow: 0 8px 32px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  [data-theme="amber"] {
    --accent: #f5d6a6;
    --accent-2: #f8c8a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: 0;
  }
  body::before { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; }
  body::after { width: 400px; height: 400px; background: var(--accent-2); bottom: -100px; right: -100px; }

  .app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 24px 16px 120px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .logo { font-weight: 600; font-size: 18px; letter-spacing: 0.02em; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 8px; background: #4caf50; cursor: pointer; }
  .status-dot.warning { background: #ffb300; }
  .status-dot.critical { background: #e57373; }

  .settings-btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px; }
  .settings-btn:hover { background: rgba(0,0,0,0.04); }

  .chat { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .msg { padding: 14px 18px; border-radius: var(--radius); line-height: 1.6; }
  .msg.user { align-self: flex-end; max-width: 70%; background: var(--accent); }
  .msg.agent { align-self: stretch; background: var(--panel); backdrop-filter: blur(12px); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.6); }
  .msg.agent h1, .msg.agent h2, .msg.agent h3 { margin: 12px 0 8px; }
  .msg.agent p { margin: 8px 0; }
  .msg.agent ul, .msg.agent ol { margin: 8px 0 8px 20px; }
  .msg.agent code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.9em; }
  .msg.agent pre { background: rgba(0,0,0,0.05); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 10px 0; position: relative; }
  .copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }

  .input-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px;
    background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0));
  }
  .input-inner {
    max-width: 980px; margin: 0 auto; display: flex; gap: 8px;
    background: var(--panel); backdrop-filter: blur(12px);
    border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
  }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent;
    padding: 10px 12px; font-family: inherit; font-size: 15px; line-height: 1.5;
    max-height: 200px; min-height: 24px;
  }
  .send-btn {
    background: var(--accent); border: none; border-radius: 12px; padding: 0 18px;
    cursor: pointer; font-weight: 500; color: var(--text); align-self: flex-end;
    height: 44px; transition: opacity 0.2s;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .metrics-panel {
    display: none; background: var(--panel); backdrop-filter: blur(12px);
    border-radius: var(--radius); padding: 16px; margin-top: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.6);
  }
  .metrics-panel.open { display: block; }
  .metric-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .metric-row span:first-child { color: var(--muted); }
  .progress { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.08); overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #a8e6cf, #4caf50); transition: width 0.4s; }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    z-index: 100; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 24px; max-width: 440px; width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.15);
  }
  .modal h2 { font-size: 18px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.12); font-family: inherit; font-size: 14px;
  }
  .modal .row { display: flex; gap: 8px; margin-top: 16px; }
  .modal button { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 500; }
  .modal .primary { background: var(--accent); }
  .modal .ghost { background: rgba(0,0,0,0.06); }

  .typing { display: inline-block; }
  .typing::after { content: "…"; animation: dots 1.4s infinite; }
  @keyframes dots { 0%,20% { content: "."; } 40% { content: ".."; } 60%,100% { content: "..."; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      Monolog <span class="status-dot" id="statusDot" title="Стабильность"></span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Настройки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="chat" id="chat"></div>

  <div class="metrics-panel" id="metricsPanel"></div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <textarea id="input" placeholder="Напишите запрос…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn">Отправить</button>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Настройки</h2>
    <label for="keyInput">Groq API Key (gsk_…)</label>
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off" />
    <label style="display:flex; align-items:center; gap:8px; margin-top:12px;">
      <input type="checkbox" id="rememberKey" /> Запомнить ключ на этом устройстве
    </label>
    <div class="row">
      <button class="ghost" id="clearChat">Очистить чат</button>
      <button class="primary" id="saveSettings">Сохранить</button>
    </div>
    <div class="row">
      <button class="ghost" id="exportData">Экспорт</button>
      <button class="ghost" id="importData">Импорт</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const LS_KEY = "monolog_api_key";
const LS_PROFILE = "monolog_profile";
const LS_CHAT = "monolog_chat";

let state = {
  apiKey: localStorage.getItem(LS_KEY) || "",
  profile: JSON.parse(localStorage.getItem(LS_PROFILE) || '{"theme":"light","mind_scale":"micro"}'),
  history: JSON.parse(localStorage.getItem(LS_CHAT) || "[]"),
};

function persist() {
  if (state.apiKey) localStorage.setItem(LS_KEY, state.apiKey);
  localStorage.setItem(LS_PROFILE, JSON.stringify(state.profile));
  localStorage.setItem(LS_CHAT, JSON.stringify(state.history.slice(-50)));
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.profile.theme || "light");
}

function setStatus(value) {
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot";
  if (value < 0.5) dot.classList.add("critical");
  else if (value < 0.75) dot.classList.add("warning");
}

function renderMarkdown(text) {
  return marked.parse(text || "");
}

function addMessage(role, content) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  if (role === "agent") {
    div.innerHTML = renderMarkdown(content);
    div.querySelectorAll("pre").forEach(pre => {
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Копировать";
      btn.onclick = () => navigator.clipboard.writeText(pre.innerText);
      pre.appendChild(btn);
    });
  } else {
    div.textContent = content;
  }
  chat.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function renderMetrics(metrics) {
  const panel = document.getElementById("metricsPanel");
  const m = metrics || {};
  panel.innerHTML = `
    <div class="metric-row"><span>Стабильность</span><span>${(m.stability_index ?? 0).toFixed(2)}</span></div>
    <div class="progress"><div class="progress-fill" style="width:${(m.stability_index ?? 0) * 100}%"></div></div>
    <div class="metric-row"><span>Стадия</span><span>${m.mind_scale || "—"}</span></div>
    <div class="metric-row"><span>Циклы</span><span>${m.cycles_completed ?? 0}</span></div>
    <div class="metric-row"><span>Коллизии</span><span>${m.collisions_resolved || "0/0"}</span></div>
    <div class="metric-row"><span>Вклад человека</span><span>${((m.human_contribution ?? 0) * 100).toFixed(0)}%</span></div>
    <div class="metric-row"><span>Протокол</span><span>${m.protocol_integrity ? "соблюдён" : "сбой"}</span></div>
  `;
  panel.classList.add("open");
  setStatus(m.stability_index ?? 1);

  if ((m.stability_index ?? 1) < 0.5) {
    state.profile.theme = "amber";
  } else {
    state.profile.theme = "light";
  }
  applyTheme();
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.style.height = "auto";
  addMessage("user", text);

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  addMessage("agent", '<span class="typing"></span>');

  const headers = { "Content-Type": "application/json" };
  if (state.apiKey) headers["X-Groq-Key"] = state.apiKey;

  try {
    const r = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        message: text,
        history: state.history.slice(-6),
      }),
    });
    const data = await r.json();

    const chat = document.getElementById("chat");
    chat.removeChild(chat.lastChild);

    if (!r.ok) {
      addMessage("agent", `Ошибка: ${data.detail || r.statusText}`);
    } else {
      addMessage("agent", data.reply_text || "");
      renderMetrics(data.metrics);
      state.history.push({ role: "user", content: text });
      state.history.push({ role: "assistant", content: data.reply_text || "" });
      persist();
    }
  } catch (e) {
    const chat = document.getElementById("chat");
    chat.removeChild(chat.lastChild);
    addMessage("agent", `Сбой сети: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("sendBtn").onclick = send;
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});
document.getElementById("statusDot").onclick = () => {
  document.getElementById("metricsPanel").classList.toggle("open");
};

const modalBg = document.getElementById("modalBg");
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("keyInput").value = state.apiKey || "";
  document.getElementById("rememberKey").checked = !!localStorage.getItem(LS_KEY);
  modalBg.classList.add("open");
};
document.getElementById("saveSettings").onclick = () => {
  const key = document.getElementById("keyInput").value.trim();
  const remember = document.getElementById("rememberKey").checked;
  state.apiKey = key;
  if (remember && key) localStorage.setItem(LS_KEY, key);
  else localStorage.removeItem(LS_KEY);
  modalBg.classList.remove("open");
};
document.getElementById("clearChat").onclick = () => {
  state.history = [];
  document.getElementById("chat").innerHTML = "";
  persist();
  modalBg.classList.remove("open");
};
document.getElementById("exportData").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `monolog_export_${Date.now()}.json`;
  a.click();
};
document.getElementById("importData").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      state.history = data.history || [];
      state.profile = data.profile || state.profile;
      localStorage.setItem(LS_CHAT, JSON.stringify(state.history));
      localStorage.setItem(LS_PROFILE, JSON.stringify(state.profile));
      location.reload();
    } catch (err) { alert("Некорректный файл"); }
  };
  reader.readAsText(file);
};

// Восстановление истории при загрузке
applyTheme();
state.history.forEach(m => addMessage(m.role === "user" ? "user" : "agent", m.content));
</script>
</body>
</html>
