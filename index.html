<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F8FA" />
<title>Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --text: #0A0B0D;
    --muted: #6B7280;
    --border: rgba(10, 11, 13, 0.08);
    --accent: #1A1F36;
    --accent-soft: rgba(26, 31, 54, 0.08);
    --warning: #C68B3F;
    --critical: #B85450;
    --shadow: 0 1px 3px rgba(10, 11, 13, 0.04), 0 4px 16px rgba(10, 11, 13, 0.04);
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -100px 0 0 0;
    background: radial-gradient(700px 500px at 80% 0%, rgba(26, 31, 54, 0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(var(--safe-top) + 14px) 0 12px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
  }
  .brand svg { width: 20px; height: 20px; color: var(--accent); }

  .header-actions { display: flex; gap: 6px; align-items: center; }

  .stability-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px 5px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: var(--shadow);
  }
  .stability-chip:active { transform: scale(0.96); }
  .stability-bar {
    width: 28px; height: 3px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .stability-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s;
  }
  .stability-chip.warning .stability-fill { background: var(--warning); }
  .stability-chip.critical .stability-fill { background: var(--critical); }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; }

  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 6px 0 16px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .row.user { justify-content: flex-end; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    margin-top: 1px;
    overflow: hidden;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .avatar svg { width: 22px; height: 22px; display: block; }
  .avatar.analyst { color: var(--muted); }
  .avatar.thinking { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }

  .avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .avatar-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    opacity: 0;
    animation: fadeIn 0.4s 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .row.user .bubble {
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 78%;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .row.agent .bubble {
    background: transparent;
    padding: 2px 0 0;
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
  }

  .msg-copy {
    position: absolute;
    top: 0; right: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .bubble:hover .msg-copy { opacity: 1; }
  .row.agent .bubble .msg-copy { opacity: 0.4; }
  .row.agent .bubble .msg-copy:hover { opacity: 1; color: var(--accent); }
  .msg-copy:active { transform: scale(0.92); }
  .msg-copy svg { width: 14px; height: 14px; }

  .msg-important {
    position: absolute;
    top: 0; right: 34px;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .row.agent .bubble .msg-important { opacity: 0.4; }
  .row.agent .bubble .msg-important:hover { opacity: 1; }
  .msg-important.active { color: var(--warning); opacity: 1; }
  .msg-important.active svg { fill: var(--warning); }
  .msg-important svg { width: 13px; height: 13px; }

  .bubble h1, .bubble h2, .bubble h3 {
    margin: 14px 0 6px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 16px; }
  .bubble h2 { font-size: 15px; }
  .bubble h3 { font-size: 14px; }
  .bubble p { margin: 6px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
  .bubble li { margin: 3px 0; }
  .bubble li::marker { color: var(--accent); }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .bubble blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin: 8px 0;
    color: var(--muted);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bubble code {
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.88em;
  }
  .bubble pre {
    background: #0A0B0D;
    color: #E8EAED;
    padding: 12px;
    padding-top: 34px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 10px 0;
    position: relative;
    font-size: 12px;
    line-height: 1.55;
  }
  .bubble pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .copy-code-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 10.5px;
    color: #E8EAED;
    cursor: pointer;
  }
  .copy-code-btn:active { transform: scale(0.95); }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  .bubble table thead { background: var(--surface-2); }
  .bubble table th, .bubble table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .bubble table th { font-weight: 600; font-size: 12.5px; }

  .typing { display: inline-flex; gap: 3px; align-items: center; padding: 2px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  .thinking-text {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-style: italic;
  }

  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 2px 4px;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 200px;
    box-shadow: var(--shadow);
  }
  .attach-chip svg { width: 13px; height: 13px; color: var(--muted); flex-shrink: 0; }
  .attach-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .attach-chip .remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .attach-chip .remove:hover { color: var(--text); }

  .input-wrap {
    flex-shrink: 0;
    padding: 8px 0 calc(12px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    position: sticky;
    bottom: 0;
  }
  .input-inner {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 4px 4px 6px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  .attach-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  .attach-btn:hover { color: var(--accent); }
  .attach-btn:active { transform: scale(0.92); }
  .attach-btn svg { width: 18px; height: 18px; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    max-height: 110px;
    min-height: 22px;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  /* Sheet */
  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 85dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 12px 20px calc(20px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 51;
    overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(10, 11, 13, 0.12);
    max-width: 700px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 32px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
    cursor: grab;
  }
  .sheet h3 { font-size: 14px; margin-bottom: 3px; font-weight: 600; letter-spacing: -0.02em; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .group-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 16px 0 6px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 0; }
  .metric {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .metric:last-child { border-bottom: none; }
  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .metric-row span:first-child { color: var(--muted); }
  .metric-row span:last-child { font-weight: 500; text-align: right; }
  .progress {
    height: 4px; border-radius: 2px;
    background: var(--border); overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s;
  }
  .progress-fill.warning { background: var(--warning); }
  .progress-fill.critical { background: var(--critical); }

  /* Паспорт проекта */
  .passport-level {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  .passport-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .passport-goal {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .passport-field {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .passport-field:last-child { border-bottom: none; }
  .passport-field-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .passport-field-value {
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .passport-field-value ul { list-style: none; padding: 0; margin: 0; }
  .passport-field-value li {
    padding: 3px 0 3px 14px;
    position: relative;
    font-size: 13.5px;
  }
  .passport-field-value li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 12px;
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* Профиль — ценностный компас */
  .compass-wrap {
    display: flex;
    justify-content: center;
    padding: 8px 0 14px;
  }
  .compass-svg { width: 220px; height: 220px; }
  .compass-axis { stroke: var(--border); stroke-width: 1; fill: none; }
  .compass-ring { stroke: var(--border); stroke-width: 1; fill: none; }
  .compass-fill {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 1.5;
    transition: opacity 0.3s;
  }
  .compass-label {
    font-size: 9px;
    fill: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .compass-dot {
    fill: var(--accent);
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    background: var(--surface-2);
    border-radius: 999px;
    font-size: 12px;
    color: var(--text);
  }
  .tag.warm { background: rgba(198, 139, 63, 0.12); color: var(--warning); }

  .empty-note {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 10px 0;
  }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 60;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + var(--safe-bottom));
    width: 100%;
    max-width: 700px;
    max-height: 90dvh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.02em; }
  .modal .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 5px;
    font-weight: 500;
  }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14px;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.2s, background 0.2s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .modal .check {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 12px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal .check input { width: 17px; height: 17px; accent-color: var(--accent); }

  .segmented {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-top: 5px;
  }
  .segmented button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(10, 11, 13, 0.06);
  }

  .modal .row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal button.action {
    flex: 1;
    padding: 12px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .modal button.action:active { transform: scale(0.97); }
  .modal .primary { background: var(--accent); color: #fff; }
  .modal .ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .modal .danger { background: var(--critical); color: #fff; }

  .reset-list {
    max-height: 40dvh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 10px;
  }
  .reset-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
  }
  .reset-item:last-child { border-bottom: none; }
  .reset-item input { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
  .reset-item .preview {
    flex: 1;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .reset-item .role {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 2px;
  }

  .toast {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(10, 11, 13, 0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 768px) {
    .sheet {
      left: 50%; right: auto;
      transform: translate(-50%, 100%);
      width: 580px;
      border-radius: 20px;
      bottom: 24px;
    }
    .sheet.open { transform: translate(-50%, 0); }
    .modal {
      border-radius: 20px;
      margin-bottom: 24px;
      width: 500px;
    }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  const API_BASE = window.location.origin;
  const LS_KEY = "monolog_api_key";
  const LS_PROFILE = "monolog_profile";
  const LS_CHAT = "monolog_chat";
  const LS_METRICS = "monolog_last_metrics";
  const LS_PASSPORT = "monolog_passport";
  const LS_COGNITIVE = "monolog_cognitive_profile";

  const MAX_FILE_SIZE = 5 * 1024 * 1024;
  const MAX_TEXT_CHARS = 3000;
  const MAX_FILES = 3;
  const CONTEXT_TOKEN_BUDGET = 1200;

  const AVATAR_STRATEGIST = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="11" r="5"/><path d="M5 27c0-5 5-9 11-9s11 4 11 9"/></svg>';
  const AVATAR_ANALYST = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="11" r="5"/><path d="M5 27c0-5 5-9 11-9 2 0 4 .4 5.5 1.2"/><rect x="18" y="20" width="9" height="7" rx="1.5"/><path d="M20 23h5"/></svg>';

  const THINKING_PHRASES = [
    "Синхронизирую с плоскостью…",
    "Проверяю коллизии…",
    "Строю карту восприятия…",
    "Оцениваю стабильность…"
  ];

  const COMPASS_AXES = [
    { key: "развитие", label: "Развитие" },
    { key: "стабильность", label: "Стабильность" },
    { key: "свобода", label: "Свобода" },
    { key: "контроль", label: "Контроль" },
    { key: "связь", label: "Связь" },
  ];

  const state = {
    apiKey: "",
    profile: { depth: "deep" },
    history: [],
    attachments: [],
    lastKeySource: null,
    lastMetrics: null,
    importantIds: new Set(),
    shownAvatarLabels: new Set(),
    passport: null,
    cognitive: null,
  };

  try { state.apiKey = localStorage.getItem(LS_KEY) || ""; } catch (e) {}
  try {
    const p = JSON.parse(localStorage.getItem(LS_PROFILE) || "null");
    if (p) state.profile = Object.assign(state.profile, p);
  } catch (e) {}
  try { state.history = JSON.parse(localStorage.getItem(LS_CHAT) || "[]"); } catch (e) { state.history = []; }
  try { state.lastMetrics = JSON.parse(localStorage.getItem(LS_METRICS) || "null"); } catch (e) {}
  try { state.passport = JSON.parse(localStorage.getItem(LS_PASSPORT) || "null"); } catch (e) {}
  try { state.cognitive = JSON.parse(localStorage.getItem(LS_COGNITIVE) || "null"); } catch (e) {}

  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }

  function persist() {
    try {
      if (state.apiKey) localStorage.setItem(LS_KEY, state.apiKey);
      localStorage.setItem(LS_PROFILE, JSON.stringify(state.profile));
      localStorage.setItem(LS_CHAT, JSON.stringify(state.history.slice(-100)));
      if (state.lastMetrics) localStorage.setItem(LS_METRICS, JSON.stringify(state.lastMetrics));
      if (state.passport) localStorage.setItem(LS_PASSPORT, JSON.stringify(state.passport));
      if (state.cognitive) localStorage.setItem(LS_COGNITIVE, JSON.stringify(state.cognitive));
    } catch (e) {}
  }

  function toast(text) {
    const el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function applyProfile() {
    document.querySelectorAll("#depthSeg button").forEach(function (el) {
      el.classList.toggle("active", el.dataset.depth === state.profile.depth);
    });
  }

  function renderMarkdown(text) {
    const safe = text == null ? "" : String(text);
    if (typeof marked !== "undefined" && marked && typeof marked.parse === "function") {
      try { return marked.parse(safe); } catch (e) {}
    }
    const esc = safe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return "<p>" + esc.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
  }

  function escHtml(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function pickAvatar(metrics) {
    const scale = (metrics && metrics.mind_scale) || "";
    if (scale === "strategic" || scale === "systemic") {
      return { html: AVATAR_STRATEGIST, cls: "", label: "Стратег" };
    }
    return { html: AVATAR_ANALYST, cls: "analyst", label: "Аналитик" };
  }

  function addRow(role, content, metrics, options) {
    options = options || {};
    const chat = document.getElementById("chat");
    if (!chat) return null;

    const row = document.createElement("div");
    row.className = "row " + role;

    if (role === "agent") {
      const wrap = document.createElement("div");
      wrap.className = "avatar-wrap";
      const av = pickAvatar(metrics);
      const avatar = document.createElement("div");
      avatar.className = "avatar " + av.cls;
      avatar.innerHTML = av.html;
      wrap.appendChild(avatar);
      if (!state.shownAvatarLabels.has(av.label)) {
        const lbl = document.createElement("span");
        lbl.className = "avatar-label";
        lbl.textContent = av.label;
        wrap.appendChild(lbl);
        state.shownAvatarLabels.add(av.label);
      }
      row.appendChild(wrap);
      row._avatar = avatar;
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "agent") {
      bubble.innerHTML = renderMarkdown(content);

      const copyBtn = document.createElement("button");
      copyBtn.className = "msg-copy";
      copyBtn.type = "button";
      copyBtn.title = "Копировать сообщение";
      copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyBtn.addEventListener("click", function () {
        if (navigator.clipboard) navigator.clipboard.writeText(content || "");
        toast("Скопировано");
      });
      bubble.appendChild(copyBtn);

      const impBtn = document.createElement("button");
      impBtn.className = "msg-important";
      impBtn.type = "button";
      impBtn.title = "Пометить как важное";
      impBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>';
      const msgId = options.msgId != null ? options.msgId : state.history.length;
      if (state.importantIds.has(msgId)) impBtn.classList.add("active");
      impBtn.addEventListener("click", function () {
        if (state.importantIds.has(msgId)) state.importantIds.delete(msgId);
        else state.importantIds.add(msgId);
        impBtn.classList.toggle("active");
      });
      bubble.appendChild(impBtn);

      bubble.querySelectorAll("pre").forEach(function (pre) {
        const btn = document.createElement("button");
        btn.className = "copy-code-btn";
        btn.type = "button";
        btn.textContent = "Копировать";
        btn.addEventListener("click", function () {
          const code = pre.querySelector("code");
          const text = code ? code.innerText : pre.innerText;
          if (navigator.clipboard) navigator.clipboard.writeText(text);
          btn.textContent = "Готово";
          setTimeout(function () { btn.textContent = "Копировать"; }, 1200);
        });
        pre.appendChild(btn);
      });
    } else {
      bubble.textContent = content;
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return { row: row, bubble: bubble, avatar: row._avatar };
  }

  function updateChip(metrics) {
    const chip = document.getElementById("stabilityChip");
    const fill = document.getElementById("chipFill");
    const val = document.getElementById("chipValue");
    if (!chip || !fill || !val) return;
    const si = metrics && typeof metrics.stability_index === "number" ? metrics.stability_index : 0;
    chip.className = "stability-chip";
    if (si < 0.5) chip.classList.add("critical");
    else if (si < 0.75) chip.classList.add("warning");
    fill.style.width = (si * 100) + "%";
    val.textContent = si.toFixed(2);
  }

  function updateMetrics(metrics) {
    const m = metrics || {};
    state.lastMetrics = m;

    if (m.passport) {
      state.passport = Object.assign(state.passport || {}, m.passport);
    }
    if (m.profile) {
      state.cognitive = state.cognitive || { values: {}, patterns: [], distortions: [], insights: [] };
      if (m.profile.values && typeof m.profile.values === "object") {
        state.cognitive.values = Object.assign(state.cognitive.values || {}, m.profile.values);
      }
      ["patterns", "distortions", "insights"].forEach(function (k) {
        const old = state.cognitive[k] || [];
        const incoming = m.profile[k] || [];
        const seen = new Set(old.map(String));
        incoming.forEach(function (it) {
          if (!seen.has(String(it))) { old.push(it); seen.add(String(it)); }
        });
        state.cognitive[k] = old;
      });
    }

    persist();

    const si = typeof m.stability_index === "number" ? m.stability_index : 0;
    document.getElementById("mStability").textContent = si.toFixed(2);
    const prog = document.getElementById("mProgress");
    prog.style.width = (si * 100) + "%";
    prog.className = "progress-fill";
    if (si < 0.5) prog.classList.add("critical");
    else if (si < 0.75) prog.classList.add("warning");

    document.getElementById("mStatus").textContent = m.indicator_status || "—";
    document.getElementById("mProtocol").textContent = m.protocol_integrity === false ? "сбой" : "соблюдён";
    document.getElementById("mScale").textContent = m.mind_scale || "—";
    document.getElementById("mCycles").textContent = m.cycles_completed != null ? m.cycles_completed : "—";
    document.getElementById("mCollisions").textContent = m.collisions_resolved || "—";
    document.getElementById("mPulse").textContent = m.cognitive_pulse || "—";

    const hc = typeof m.human_contribution === "number" ? m.human_contribution : null;
    document.getElementById("mHuman").textContent = hc != null
      ? Math.round(hc * 100) + "% / " + Math.round((1 - hc) * 100) + "%"
      : "—";
    document.getElementById("mKeySource").textContent = state.lastKeySource === "user" ? "свой" : "сервисный";

    updateChip(m);
  }

  function estimateTokens(text) {
    return Math.ceil((text || "").length / 4);
  }

  function selectContext() {
    const result = [];
    let usedTokens = 0;

    const important = [];
    const normal = [];
    for (let i = 0; i < state.history.length; i++) {
      const m = state.history[i];
      if (state.importantIds.has(i)) important.push(m);
      else normal.push(m);
    }

    const tail = normal.slice(-2);
    const rest = normal.slice(0, Math.max(0, normal.length - 2));

    for (let i = important.length - 1; i >= 0; i--) {
      const m = important[i];
      const t = estimateTokens(m.content);
      if (usedTokens + t > CONTEXT_TOKEN_BUDGET) break;
      result.unshift(m);
      usedTokens += t;
    }

    for (const m of tail) {
      const t = estimateTokens(m.content);
      if (usedTokens + t > CONTEXT_TOKEN_BUDGET) continue;
      result.push(m);
      usedTokens += t;
    }

    for (let i = rest.length - 1; i >= 0; i--) {
      const m = rest[i];
      const t = estimateTokens(m.content);
      if (usedTokens + t > CONTEXT_TOKEN_BUDGET) break;
      result.unshift(m);
      usedTokens += t;
    }

    return result.slice(-4);
  }

  function fileIcon(type) {
    if (type && type.startsWith("image/")) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  }

  async function extractTextFromFile(file) {
    const name = file.name || "";
    const type = file.type || "";
    const ext = name.split(".").pop().toLowerCase();

    if (type.startsWith("image/")) return "[Изображение: " + name + "]";
    if (ext === "txt" || type === "text/plain") return await file.text();

    if (ext === "docx" && window.mammoth) {
      try {
        const buf = await file.arrayBuffer();
        const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
        return r.value || "";
      } catch (e) { return "[Не удалось прочитать DOCX]"; }
    }

    if (ext === "pdf" && window.pdfjsLib) {
      try {
        const buf = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        let out = "";
        const pages = Math.min(pdf.numPages, 10);
        for (let i = 1; i <= pages; i++) {
          const page = await pdf.getPage(i);
          const c = await page.getTextContent();
          out += c.items.map(function (it) { return it.str; }).join(" ") + "\n";
        }
        return out;
      } catch (e) { return "[Не удалось прочитать PDF]"; }
    }
    return "[Формат не поддерживается: " + name + "]";
  }

  function renderAttachPreview() {
    const box = document.getElementById("attachPreview");
    box.innerHTML = "";
    state.attachments.forEach(function (a, idx) {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      chip.innerHTML = fileIcon(a.type)
        + '<span class="name">' + escHtml(a.name) + '</span>'
        + '<button class="remove" title="Удалить">×</button>';
      chip.querySelector(".remove").addEventListener("click", function () {
        state.attachments.splice(idx, 1);
        renderAttachPreview();
      });
      box.appendChild(chip);
    });
  }

  async function handleFiles(files) {
    const list = Array.from(files || []);
    for (const f of list) {
      if (state.attachments.length >= MAX_FILES) { alert("Максимум " + MAX_FILES + " файла"); break; }
      if (f.size > MAX_FILE_SIZE) { alert("Файл " + f.name + " больше 5 МБ"); continue; }
      let text = await extractTextFromFile(f);
      if (text.length > MAX_TEXT_CHARS) text = text.slice(0, MAX_TEXT_CHARS) + "\n…[обрезано]";
      state.attachments.push({ name: f.name, type: f.type, text: text });
    }
    renderAttachPreview();
  }

  async function send() {
    const input = document.getElementById("input");
    const btn = document.getElementById("sendBtn");
    const text = (input.value || "").trim();
    if (!text && state.attachments.length === 0) return;

    const userDisplay = text || ("[Вложение: " + state.attachments.map(function (a) { return a.name; }).join(", ") + "]");
    input.value = "";
    input.style.height = "auto";
    addRow("user", userDisplay);

    const attachmentsPayload = state.attachments.slice();
    state.attachments = [];
    renderAttachPreview();

    btn.disabled = true;

    const thinking = addRow("agent", "");
    const bubble = thinking.bubble;
    if (thinking.avatar) thinking.avatar.classList.add("thinking");
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>'
      + '<span class="thinking-text">' + THINKING_PHRASES[Math.floor(Math.random() * THINKING_PHRASES.length)] + '</span>';

    const headers = { "Content-Type": "application/json" };
    if (state.apiKey) headers["X-Groq-Key"] = state.apiKey;

    const context = selectContext();

    // carried_metrics — накопленные passport/profile из localStorage
    const carried = {
      passport: state.passport || {},
      profile: state.cognitive || {},
    };

    try {
      const r = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          message: text || "Проанализируй вложения.",
          history: context,
          attachments: attachmentsPayload,
          carried_metrics: carried,
        }),
      });

      let data = null;
      try { data = await r.json(); } catch (e) {}

      const chat = document.getElementById("chat");
      if (thinking && thinking.row && thinking.row.parentNode === chat) chat.removeChild(thinking.row);

      if (!r.ok) {
        addRow("agent", "Ошибка: " + ((data && data.detail) || r.statusText));
      } else if (data) {
        state.lastKeySource = data.key_source || null;
        const newMsgId = state.history.length;
        addRow("agent", data.reply_text || "", data.metrics, { msgId: newMsgId });
        updateMetrics(data.metrics);
        state.history.push({ role: "user", content: userDisplay });
        state.history.push({ role: "assistant", content: data.reply_text || "" });
        persist();
      } else {
        addRow("agent", "Пустой ответ сервера.");
      }
    } catch (e) {
      const chat = document.getElementById("chat");
      if (thinking && thinking.row && thinking.row.parentNode === chat) chat.removeChild(thinking.row);
      addRow("agent", "Сбой сети: " + (e && e.message ? e.message : "unknown"));
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  // --- Sheet: метрики ---
  function openSheet() {
    document.getElementById("sheetBg").classList.add("open");
    document.getElementById("metricsSheet").classList.add("open");
  }
  function closeSheet() {
    document.getElementById("sheetBg").classList.remove("open");
    document.getElementById("metricsSheet").classList.remove("open");
  }

  // --- Sheet: паспорт ---
  function renderPassport() {
    const box = document.getElementById("passportContent");
    const p = state.passport;

    if (!p || (!p.title && !p.goal && !p.result)) {
      box.innerHTML = '<h3>Паспорт проекта</h3><div class="sheet-sub">Пока не заполнен</div>'
        + '<div class="empty-note">Паспорт заполняется автоматически по мере диалога. Начни описывать проект — Monolog соберёт данные.</div>';
      return;
    }

    const levelLabels = {
      micro: "Микро",
      tactical: "Тактический",
      strategic: "Стратегический",
      systemic: "Системный",
    };
    const lvl = p.level || "micro";
    const completion = Math.max(0, Math.min(100, p.completion || 0));

    let html = '<h3>Паспорт проекта</h3>';
    html += '<div class="sheet-sub">Обновляется автоматически</div>';
    html += '<span class="passport-level">' + (levelLabels[lvl] || lvl) + '</span>';

    if (p.title) html += '<div class="passport-title">' + escHtml(p.title) + '</div>';
    if (p.goal) html += '<div class="passport-goal">' + escHtml(p.goal) + '</div>';

    html += '<div class="metric" style="margin-top:12px;">'
      + '<div class="metric-row"><span>Наполнение</span><span>' + completion + '%</span></div>'
      + '<div class="progress"><div class="progress-fill" style="width:' + completion + '%"></div></div>'
      + '</div>';

    function field(label, value) {
      if (!value) return "";
      if (Array.isArray(value)) {
        if (value.length === 0) return "";
        return '<div class="passport-field"><div class="passport-field-label">' + label + '</div>'
          + '<div class="passport-field-value"><ul>'
          + value.map(function (v) { return '<li>' + escHtml(typeof v === "string" ? v : JSON.stringify(v)) + '</li>'; }).join("")
          + '</ul></div></div>';
      }
      return '<div class="passport-field"><div class="passport-field-label">' + label + '</div>'
        + '<div class="passport-field-value">' + escHtml(value) + '</div></div>';
    }

    html += field("Результат", p.result);
    html += field("Миссия", p.mission);
    html += field("Ценности", p.values);
    html += field("Ограничения", p.constraints);
    html += field("Стейкхолдеры", p.stakeholders);
    html += field("Риски", p.risks);
    html += field("Метрики успеха", p.metrics);

    box.innerHTML = html;
  }

  function openPassport() {
    renderPassport();
    document.getElementById("sheetBg").classList.add("open");
    document.getElementById("passportSheet").classList.add("open");
  }

  // --- Sheet: профиль ---
  function renderCompass(values) {
    const size = 220;
    const cx = size / 2;
    const cy = size / 2;
    const radius = 80;
    const n = COMPASS_AXES.length;

    function point(i, r) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      return [cx + Math.cos(angle) * r, cy + Math.sin(angle) * r];
    }

    let svg = '<svg class="compass-svg" viewBox="0 0 ' + size + ' ' + size + '">';

    [1, 0.66, 0.33].forEach(function (scale) {
      let ring = "";
      for (let i = 0; i < n; i++) {
        const [x, y] = point(i, radius * scale);
        ring += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      }
      ring += "Z";
      svg += '<path class="compass-ring" d="' + ring + '"/>';
    });

    for (let i = 0; i < n; i++) {
      const [x, y] = point(i, radius);
      svg += '<line class="compass-axis" x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    }

    const vals = COMPASS_AXES.map(function (a) {
      const v = values && typeof values[a.key] === "number" ? values[a.key] : 0;
      return Math.max(0, Math.min(1, v));
    });

    if (vals.some(function (v) { return v > 0; })) {
      let poly = "";
      vals.forEach(function (v, i) {
        const [x, y] = point(i, radius * v);
        poly += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      });
      poly += "Z";
      svg += '<path class="compass-fill" d="' + poly + '"/>';

      vals.forEach(function (v, i) {
        if (v <= 0) return;
        const [x, y] = point(i, radius * v);
        svg += '<circle class="compass-dot" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.5"/>';
      });
    }

    for (let i = 0; i < n; i++) {
      const [x, y] = point(i, radius + 20);
      const anchor = Math.abs(x - cx) < 4 ? "middle" : (x > cx ? "start" : "end");
      svg += '<text class="compass-label" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + COMPASS_AXES[i].label + '</text>';
    }

    svg += '</svg>';
    return svg;
  }

  function renderProfile() {
    const box = document.getElementById("profileContent");
    const c = state.cognitive;

    let html = '<h3>Профиль</h3>';
    html += '<div class="sheet-sub">Когнитивная карта пользователя</div>';

    html += '<div class="group-title">Ценностный компас</div>';
    if (!c || !c.values || Object.keys(c.values).length === 0) {
      html += '<div class="empty-note">Пока нет данных. Продолжай диалог — Monolog накопит информацию.</div>';
    } else {
      html += '<div class="compass-wrap">' + renderCompass(c.values) + '</div>';
    }

    html += '<div class="group-title">Паттерны мышления</div>';
    if (!c || !c.patterns || c.patterns.length === 0) {
      html += '<div class="empty-note">Пока не выявлены.</div>';
    } else {
      html += '<div class="tag-list">'
        + c.patterns.map(function (p) { return '<span class="tag">' + escHtml(p) + '</span>'; }).join("")
        + '</div>';
    }

    html += '<div class="group-title">Когнитивные искажения</div>';
    if (!c || !c.distortions || c.distortions.length === 0) {
      html += '<div class="empty-note">Не обнаружены.</div>';
    } else {
      html += '<div class="tag-list">'
        + c.distortions.map(function (p) { return '<span class="tag warm">' + escHtml(p) + '</span>'; }).join("")
        + '</div>';
    }

    html += '<div class="group-title">Наблюдения</div>';
    if (!c || !c.insights || c.insights.length === 0) {
      html += '<div class="empty-note">Пока нет.</div>';
    } else {
      html += '<div style="display:flex; flex-direction:column; gap:8px;">'
        + c.insights.map(function (i) { return '<div class="passport-field-value">' + escHtml(i) + '</div>'; }).join("")
        + '</div>';
    }

    box.innerHTML = html;
  }

  function openProfile() {
    renderProfile();
    document.getElementById("sheetBg").classList.add("open");
    document.getElementById("profileSheet").classList.add("open");
  }

  // --- Модальные окна ---
  function openModal() {
    document.getElementById("keyInput").value = state.apiKey || "";
    document.getElementById("rememberKey").checked = !!localStorage.getItem(LS_KEY);
    applyProfile();
    document.getElementById("modalBg").classList.add("open");
  }
  function closeModal() { document.getElementById("modalBg").classList.remove("open"); }

  function openResetModal() {
    document.getElementById("partialSection").style.display = "none";
    document.getElementById("resetModalBg").classList.add("open");
  }
  function closeResetModal() { document.getElementById("resetModalBg").classList.remove("open"); }

  function renderResetList() {
    const list = document.getElementById("resetList");
    list.innerHTML = "";
    state.history.forEach(function (m, idx) {
      const item = document.createElement("label");
      item.className = "reset-item";
      const checked = state.importantIds.has(idx) ? "checked" : "";
      const roleLabel = m.role === "user" ? "Вы" : "ИИ";
      item.innerHTML = '<input type="checkbox" data-idx="' + idx + '" ' + checked + '>'
        + '<div><div class="role">' + roleLabel + '</div><div class="preview">' + escHtml(m.content || "") + '</div></div>';
      item.querySelector("input").addEventListener("change", function (e) {
        const i = parseInt(e.target.dataset.idx, 10);
        if (e.target.checked) state.importantIds.add(i);
        else state.importantIds.delete(i);
      });
      list.appendChild(item);
    });
  }

  function setupSwipeToClose(sheetEl, handleEl) {
    if (!sheetEl || !handleEl) return;
    let startY = 0, currentY = 0, dragging = false;
    function onStart(e) { dragging = true; startY = (e.touches ? e.touches[0].clientY : e.clientY); sheetEl.style.transition = "none"; }
    function onMove(e) { if (!dragging) return; currentY = (e.touches ? e.touches[0].clientY : e.clientY); const dy = Math.max(0, currentY - startY); sheetEl.style.transform = "translateY(" + dy + "px)"; }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      sheetEl.style.transition = "";
      sheetEl.style.transform = "";
      if (currentY - startY > 70) {
        sheetEl.classList.remove("open");
        document.getElementById("sheetBg").classList.remove("open");
      }
    }
    handleEl.addEventListener("touchstart", onStart, { passive: true });
    handleEl.addEventListener("touchmove", onMove, { passive: true });
    handleEl.addEventListener("touchend", onEnd);
    handleEl.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);
  }

  function init() {
    applyProfile();

    setupSwipeToClose(document.getElementById("metricsSheet"), document.getElementById("sheetHandle"));
    setupSwipeToClose(document.getElementById("passportSheet"), document.getElementById("passportHandle"));
    setupSwipeToClose(document.getElementById("profileSheet"), document.getElementById("profileHandle"));

    state.history.forEach(function (m, idx) {
      addRow(m.role === "user" ? "user" : "agent", m.content || "", null, { msgId: idx });
    });

    if (state.lastMetrics) updateChip(state.lastMetrics);

    const sendBtn = document.getElementById("sendBtn");
    const input = document.getElementById("input");
    const fileInput = document.getElementById("fileInput");

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 110) + "px";
    });

    document.getElementById("attachBtn").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function (e) { handleFiles(e.target.files); fileInput.value = ""; });

    document.getElementById("stabilityChip").addEventListener("click", openSheet);
    document.getElementById("passportBtn").addEventListener("click", openPassport);
    document.getElementById("sheetBg").addEventListener("click", function () {
      closeSheet();
      document.getElementById("passportSheet").classList.remove("open");
      document.getElementById("profileSheet").classList.remove("open");
    });

    document.getElementById("settingsBtn").addEventListener("click", openModal);
    document.getElementById("modalBg").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
    document.getElementById("profileBtn").addEventListener("click", function () {
      closeModal();
      openProfile();
    });

    document.getElementById("resetBtn").addEventListener("click", openResetModal);
    document.getElementById("resetModalBg").addEventListener("click", function (e) { if (e.target === this) closeResetModal(); });
    document.getElementById("resetCancel").addEventListener("click", closeResetModal);
    document.getElementById("resetFull").addEventListener("click", function () {
      state.history = [];
      state.importantIds = new Set();
      state.lastMetrics = null;
      document.getElementById("chat").innerHTML = "";
      localStorage.removeItem(LS_CHAT);
      localStorage.removeItem(LS_METRICS);
      document.getElementById("chipValue").textContent = "—";
      document.getElementById("chipFill").style.width = "0%";
      closeResetModal();
      toast("Контекст сброшен, паспорт сохранён");
    });
    document.getElementById("resetPartial").addEventListener("click", function () {
      renderResetList();
      document.getElementById("partialSection").style.display = "block";
    });
    document.getElementById("partialBack").addEventListener("click", function () {
      document.getElementById("partialSection").style.display = "none";
    });
    document.getElementById("partialConfirm").addEventListener("click", function () {
      const keep = [];
      const newImportant = new Set();
      state.history.forEach(function (m, idx) {
        if (state.importantIds.has(idx)) {
          newImportant.add(keep.length);
          keep.push(m);
        }
      });
      state.history = keep;
      state.importantIds = newImportant;
      document.getElementById("chat").innerHTML = "";
      state.history.forEach(function (m, idx) {
        addRow(m.role === "user" ? "user" : "agent", m.content || "", null, { msgId: idx });
      });
      persist();
      closeResetModal();
      toast("Сохранено " + keep.length + " сообщений");
    });

    document.querySelectorAll("#depthSeg button").forEach(function (el) {
      el.addEventListener("click", function () {
        state.profile.depth = el.dataset.depth;
        applyProfile();
      });
    });

    document.getElementById("saveSettings").addEventListener("click", function () {
      const key = (document.getElementById("keyInput").value || "").trim();
      const remember = document.getElementById("rememberKey").checked;
      state.apiKey = key;
      if (remember && key) localStorage.setItem(LS_KEY, key);
      else localStorage.removeItem(LS_KEY);
      persist();
      closeModal();
    });

    document.getElementById("exportData").addEventListener("click", function () {
      const blob = new Blob([JSON.stringify({
        history: state.history,
        profile: state.profile,
        passport: state.passport,
        cognitive: state.cognitive,
      }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "monolog_export_" + Date.now() + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById("importData").addEventListener("click", function () {
      document.getElementById("importFile").click();
    });
    document.getElementById("importFile").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const data = JSON.parse(reader.result);
          state.history = data.history || [];
          state.profile = Object.assign(state.profile, data.profile || {});
          state.passport = data.passport || null;
          state.cognitive = data.cognitive || null;
          localStorage.setItem(LS_CHAT, JSON.stringify(state.history));
          localStorage.setItem(LS_PROFILE, JSON.stringify(state.profile));
          if (state.passport) localStorage.setItem(LS_PASSPORT, JSON.stringify(state.passport));
          if (state.cognitive) localStorage.setItem(LS_COGNITIVE, JSON.stringify(state.cognitive));
          location.reload();
        } catch (err) { alert("Некорректный файл"); }
      };
      reader.readAsText(file);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
