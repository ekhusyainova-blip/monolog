<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro", sans-serif;
  background: #FAFAFA; color: #1A1A1A;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex; flex-direction: column;
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  position: relative;
}
body::before {
  content: ''; position: fixed; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 200, 200, 0.25), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(255, 220, 210, 0.2), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 230, 235, 0.15), transparent 50%);
  animation: drift 30s ease-in-out infinite;
  z-index: 0; pointer-events: none;
}
@keyframes drift {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(-3%, 2%) rotate(3deg); }
}
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  z-index: 2;
}
header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; color: #6B7280;
  transition: all 0.2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.9); color: #1A1A1A; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
#chat-box {
  flex: 1; overflow-y: auto;
  padding: 8px 4px;
  -webkit-overflow-scrolling: touch;
  z-index: 1;
}
.message {
  margin-bottom: 14px; padding: 12px 16px;
  border-radius: 18px; max-width: 88%;
  line-height: 1.55; font-size: 15px;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user {
  background: linear-gradient(135deg, rgba(255, 200, 200, 0.4), rgba(255, 220, 210, 0.3));
  border: 1px solid rgba(255, 200, 200, 0.5);
  color: #1A1A1A;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
.message.assistant {
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #1A1A1A;
  width: 100%; max-width: 100%;
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.message.assistant h1, .message.assistant h2, .message.assistant h3 {
  margin: 12px 0 6px; font-weight: 600;
}
.message.assistant h1 { font-size: 19px; }
.message.assistant h2 { font-size: 17px; }
.message.assistant h3 { font-size: 15px; color: #4B5563; }
.message.assistant p { margin: 6px 0; }
.message.assistant ul, .message.assistant ol { margin: 6px 0 6px 20px; }
.message.assistant li { margin: 3px 0; }
.message.assistant code {
  background: rgba(0,0,0,0.05); padding: 2px 6px;
  border-radius: 4px; font-size: 13px;
  font-family: "SF Mono", Monaco, monospace;
}
.message.assistant pre {
  background: rgba(0,0,0,0.04); padding: 10px;
  border-radius: 8px; overflow-x: auto;
  margin: 8px 0; font-size: 13px;
  position: relative;
}
.message.assistant pre code { background: transparent; padding: 0; }
.message.assistant blockquote {
  border-left: 2px solid rgba(255, 180, 180, 0.6);
  padding-left: 12px; margin: 8px 0;
  color: #4B5563; font-style: italic;
}
.message.assistant table {
  border-collapse: collapse; margin: 8px 0;
  width: 100%; font-size: 14px;
}
.message.assistant th, .message.assistant td {
  border: 1px solid rgba(0,0,0,0.1);
  padding: 6px 10px; text-align: left;
}
.message.assistant th { background: rgba(0,0,0,0.03); font-weight: 600; }
.message.assistant hr { border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 12px 0; }
.message.assistant strong { font-weight: 600; }
.metrics-bar {
  display: flex; gap: 8px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.06);
  font-size: 12px; color: #6B7280;
  flex-wrap: wrap;
}
.metric-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 10px;
  background: rgba(0,0,0,0.03);
  cursor: pointer; transition: background 0.2s;
}
.metric-pill:hover { background: rgba(0,0,0,0.07); }
.stability-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
}
.stability-dot.high { background: #10B981; }
.stability-dot.mid { background: #F59E0B; }
.stability-dot.low { background: #EF4444; }
.input-area {
  display: flex; gap: 8px; margin-top: 10px;
  padding: 8px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  z-index: 2;
}
#user-input {
  flex: 1; padding: 10px 14px;
  border: none; background: transparent;
  font-size: 15px; outline: none;
  color: #1A1A1A; font-family: inherit;
  resize: none; max-height: 120px;
  min-height: 20px;
}
#send-btn {
  padding: 8px 16px;
  background: linear-gradient(135deg, #FFB6C1, #FFC0CB);
  color: white; border: none;
  border-radius: 14px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  flex-shrink: 0;
}
#send-btn:disabled { background: #D1D5DB; cursor: not-allowed; }
#send-btn:active:not(:disabled) { transform: scale(0.96); }
#loading { display: none; text-align: center; color: #9CA3AF; font-size: 13px; margin: 6px 0; }
.copy-btn {
  position: absolute; top: 6px; right: 6px;
  padding: 4px 8px; font-size: 11px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 6px; cursor: pointer;
  color: #6B7280; transition: all 0.2s;
}
.copy-btn:hover { background: white; color: #1A1A1A; }
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
  z-index: 100; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: 20px; padding: 20px;
  max-width: 500px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.modal h2 { font-size: 17px; margin-bottom: 12px; }
.modal-row {
  display: flex; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
  font-size: 14px;
}
.modal-row:last-child { border-bottom: none; }
.modal-row .label { color: #6B7280; }
.modal-row .value { font-weight: 500; }
.modal-close {
  margin-top: 14px; width: 100%;
  padding: 10px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #FFB6C1, #FFC0CB);
  color: white; font-weight: 600; cursor: pointer;
}
.risk-modal .risk-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 10px;
  background: rgba(239, 68, 68, 0.1);
  margin-bottom: 12px;
}
.risk-modal .risk-header.critical { background: rgba(239, 68, 68, 0.15); }
.risk-modal .risk-header.warning { background: rgba(245, 158, 11, 0.15); }
.risk-modal .risk-dot {
  width: 12px; height: 12px; border-radius: 50%;
}
.risk-modal .risk-dot.critical { background: #EF4444; }
.risk-modal .risk-dot.warning { background: #F59E0B; }
.risk-modal .alternative {
  padding: 12px; border-radius: 10px;
  background: rgba(16, 185, 129, 0.1);
  border-left: 3px solid #10B981;
  margin: 12px 0;
}
.risk-modal .actions { display: flex; gap: 8px; margin-top: 14px; }
.risk-modal .btn-safe {
  flex: 1; padding: 10px;
  background: #10B981; color: white;
  border: none; border-radius: 12px;
  font-weight: 600; cursor: pointer;
}
.risk-modal .btn-cancel {
  flex: 1; padding: 10px;
  background: rgba(0,0,0,0.05); color: #1A1A1A;
  border: none; border-radius: 12px;
  font-weight: 600; cursor: pointer;
}
.skills-panel {
  margin-top: 12px; padding: 12px;
  background: rgba(99, 102, 241, 0.05);
  border-radius: 12px;
  border-left: 3px solid #6366F1;
}
.skills-panel h4 { font-size: 13px; color: #6366F1; margin-bottom: 8px; }
.skill-item {
  padding: 8px 0;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  font-size: 14px;
}
.skill-item:last-child { border-bottom: none; }
.skill-recs {
  margin-top: 6px; padding-left: 12px;
  font-size: 12px; color: #6B7280;
  display: none;
}
.skill-recs.open { display: block; }
.skill-toggle {
  font-size: 11px; color: #6366F1;
  cursor: pointer; margin-top: 4px;
  display: inline-block;
}
</style>
</head>
<body>
<header>
  <h1>Monolog</h1>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportData()" title="Экспорт">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    </button>
    <button class="icon-btn" onclick="document.getElementById('import-file').click()" title="Импорт">
      <svg viewBox="0 0 24 24"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>
    </button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <button class="icon-btn" onclick="clearChat()" title="Очистить">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </div>
</header>
<div id="chat-box"></div>
<div id="loading">Monolog думает...</div>
<div class="input-area">
  <textarea id="user-input" placeholder="Ваш запрос..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<div class="modal-overlay" id="metrics-modal">
  <div class="modal">
    <h2>Метрики ответа</h2>
    <div id="metrics-content"></div>
    <button class="modal-close" onclick="closeModal('metrics-modal')">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="risk-modal">
  <div class="modal risk-modal">
    <h2>Внимание: обнаружен риск</h2>
    <div id="risk-content"></div>
    <div class="actions">
      <button class="btn-safe" onclick="applySafeAlternative()">Применить альтернативу</button>
      <button class="btn-cancel" onclick="closeModal('risk-modal')">Отменить</button>
    </div>
  </div>
</div>
