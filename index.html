<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Monolog</title>
  <style>/* ... */</style>
</head>
<body>
  <div id="app"></div>
  <script src="/static/monolog.js"></script>
  <script>
    const S = Monolog.create();
    Monolog.boot = function() {
      function loop() {
        Monolog.tick(S, Math.random());
        Monolog.reproduce(S);
        requestAnimationFrame(loop);
      }
      loop();
    };
    Monolog.boot();
  </script>
</body>
</html>
