<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F8FA" />
<title>Monolog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --text: #0A0B0D;
    --muted: #6B7280;
    --border: rgba(10, 11, 13, 0.08);
    --accent: #1A1F36;
    --accent-soft: rgba(26, 31, 54, 0.08);
    --warning: #C68B3F;
    --critical: #B85450;
    --strategist: #4A6CF7;
    --analyst: #E07A5F;
    --shadow: 0 1px 3px rgba(10, 11, 13, 0.04), 0 4px 16px rgba(10, 11, 13, 0.04);
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Анимированный фон */
  .bg-anim {
    position: fixed;
    inset: -10% 0 0 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.85;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
  }
  .bg-blob.a {
    width: 480px; height: 480px;
    background: rgba(74, 108, 247, 0.14);
    top: -80px; right: -120px;
    animation: floatA 26s ease-in-out infinite;
  }
  .bg-blob.b {
    width: 420px; height: 420px;
    background: rgba(224, 122, 95, 0.12);
    bottom: -80px; left: -100px;
    animation: floatB 30s ease-in-out infinite;
  }
  .bg-blob.c {
    width: 320px; height: 320px;
    background: rgba(26, 31, 54, 0.06);
    top: 40%; left: 40%;
    animation: floatC 34s ease-in-out infinite;
  }
  @keyframes floatA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.08); }
  }
  @keyframes floatB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.06); }
  }
  @keyframes floatC {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-20px, -40px) scale(0.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-blob { animation: none; }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 12px;
  }

  /* Шапка с блюром */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(var(--safe-top) + 10px) 0 10px;
    margin: 0 -12px;
    padding-left: 12px;
    padding-right: 12px;
    background: rgba(247, 248, 250, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    color: var(--accent);
    flex-shrink: 0;
  }
  .brand svg { width: 22px; height: 22px; display: block; }

  .header-actions { display: flex; gap: 6px; align-items: center; }

  .stability-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: var(--shadow);
  }
  .stability-chip:active { transform: scale(0.96); }
  .stability-chip svg { width: 14px; height: 14px; color: var(--accent); }
  .stability-chip.warning svg { color: var(--warning); }
  .stability-chip.critical svg { color: var(--critical); }

  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 16px; height: 16px; }

  .reset-chip {
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(198, 139, 63, 0.12);
    border: 1px solid rgba(198, 139, 63, 0.28);
    color: var(--warning);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .reset-chip.show { display: inline-flex; }
  .reset-chip:active { transform: scale(0.96); }
  .reset-chip svg { width: 13px; height: 13px; }

  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 8px 0 16px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }

  /* Аватары Lottie */
  .avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .avatar .lottie-box {
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar svg { width: 22px; height: 22px; display: block; }
  .avatar.thinking .lottie-box { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  .avatar-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }

  /* Fallback SVG если Lottie не загрузился */
  .avatar .fallback {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row.user .bubble {
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    max-width: 78%;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .row.agent .bubble {
    background: transparent;
    padding: 2px 0 0;
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
  }

  .msg-copy {
    position: absolute;
    top: 0; right: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .bubble:hover .msg-copy { opacity: 1; }
  .row.agent .bubble .msg-copy { opacity: 0.35; }
  .row.agent .bubble .msg-copy:hover { opacity: 1; color: var(--accent); }
  .msg-copy:active { transform: scale(0.92); }
  .msg-copy svg { width: 14px; height: 14px; }

  .msg-important {
    position: absolute;
    top: 0; right: 34px;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    box-shadow: var(--shadow);
  }
  .row.agent .bubble .msg-important { opacity: 0.35; }
  .row.agent .bubble .msg-important:hover { opacity: 1; }
  .msg-important.active { color: var(--warning); opacity: 1; }
  .msg-important.active svg { fill: var(--warning); }
  .msg-important svg { width: 13px; height: 13px; }

  .bubble h1, .bubble h2, .bubble h3 {
    margin: 12px 0 5px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 16px; }
  .bubble h2 { font-size: 15px; }
  .bubble h3 { font-size: 14px; }
  .bubble p { margin: 5px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 5px 0 5px 18px; }
  .bubble li { margin: 2px 0; }
  .bubble li::marker { color: var(--accent); }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .bubble blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin: 8px 0;
    color: var(--muted);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble code {
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.88em;
  }
  .bubble pre {
    background: #0A0B0D;
    color: #E8EAED;
    padding: 12px;
    padding-top: 34px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 10px 0;
    position: relative;
    font-size: 12px;
    line-height: 1.55;
  }
  .bubble pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .copy-code-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 10.5px;
    color: #E8EAED;
    cursor: pointer;
  }
  .copy-code-btn:active { transform: scale(0.95); }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  .bubble table thead { background: var(--surface-2); }
  .bubble table th, .bubble table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .bubble table th { font-weight: 600; font-size: 12.5px; }

  .typing { display: inline-flex; gap: 3px; align-items: center; padding: 2px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: pulse 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  .thinking-text {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-style: italic;
  }

  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 2px 4px;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 200px;
    box-shadow: var(--shadow);
  }
  .attach-chip svg { width: 13px; height: 13px; color: var(--muted); flex-shrink: 0; }
  .attach-chip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .attach-chip .remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .attach-chip .remove:hover { color: var(--text); }

  .input-wrap {
    flex-shrink: 0;
    padding: 8px 0 calc(12px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    position: sticky;
    bottom: 0;
  }
  .input-inner {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 4px 4px 6px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  .attach-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  .attach-btn:hover { color: var(--accent); }
  .attach-btn:active { transform: scale(0.92); }
  .attach-btn svg { width: 18px; height: 18px; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    max-height: 110px;
    min-height: 22px;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 85dvh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 12px 18px calc(20px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 51;
    overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(10, 11, 13, 0.12);
    max-width: 700px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 32px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
    cursor: grab;
  }
  .sheet h3 { font-size: 14px; margin-bottom: 3px; font-weight: 600; letter-spacing: -0.02em; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .group-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 16px 0 6px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 0; }
  .metric {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .metric:last-child { border-bottom: none; }
  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .metric-row span:first-child { color: var(--muted); }
  .metric-row span:last-child { font-weight: 500; text-align: right; }
  .progress {
    height: 4px; border-radius: 2px;
    background: var(--border); overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease, background 0.3s;
  }
  .progress-fill.warning { background: var(--warning); }
  .progress-fill.critical { background: var(--critical); }

  .passport-level {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  .passport-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .passport-goal {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .passport-field {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .passport-field:last-child { border-bottom: none; }
  .passport-field-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .passport-field-value {
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .passport-field-value ul { list-style: none; padding: 0; margin: 0; }
  .passport-field-value li {
    padding: 3px 0 3px 14px;
    position: relative;
    font-size: 13.5px;
  }
  .passport-field-value li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 12px;
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 50%;
  }

  .compass-wrap { display: flex; justify-content: center; padding: 8px 0 14px; }
  .compass-svg { width: 220px; height: 220px; }
  .compass-axis { stroke: var(--border); stroke-width: 1; fill: none; }
  .compass-ring { stroke: var(--border); stroke-width: 1; fill: none; }
  .compass-fill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
  .compass-label { font-size: 9px; fill: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .compass-dot { fill: var(--accent); }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    display: inline-flex; align-items: center;
    padding: 4px 10px;
    background: var(--surface-2);
    border-radius: 999px;
    font-size: 12px;
    color: var(--text);
  }
  .tag.warm { background: rgba(198, 139, 63, 0.12); color: var(--warning); }

  .empty-note {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 10px 0;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 60;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + var(--safe-bottom));
    width: 100%;
    max-width: 700px;
    max-height: 90dvh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.02em; }
  .modal .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 5px;
    font-weight: 500;
  }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14px;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.2s, background 0.2s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .modal .check {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 12px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal .check input { width: 17px; height: 17px; accent-color: var(--accent); }

  .segmented {
    display: flex;
    background: var(--surface-2);

    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-top: 5px;
  }
  .segmented button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--surface);
    color: var(--text);

  }

  .modal .row { display: flex; gap: 8px; margin-top: 16px; }
  .modal button.action {
    flex: 1;
    padding: 12px;

    font-size: 14px;
    font-family: inherit;
    transition: transform 0.15s;
  }

  .modal .primary { background: var(--accent); color: #fff; }
  .modal .ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .modal .danger { background: var(--critical); color: #fff; }

  .toast {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(10, 11, 13, 0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 768px) {
    .sheet {
      left: 50%; right: auto;
      transform: translate(-50%, 100%);
      width: 580px;
      border-radius: 20px;
      bottom: 24px;
    }
    .sheet.open { transform: translate(-50%, 0); }
    .modal {
      border-radius: 20px;
      margin-bottom: 24px;
      width: 500px;
    }
  }
</style>
</head>
