<!-- Тема: ui -->
<!-- Слой: A (данные: запрос к ИИ, приём, кэш, fallback) -->

<script>
window.UI_A = (function(){
  var CACHE_KEY = 'monolog_ui_vars';

  var PROMPT = [
    'Заполни CSS-переменные для UI.',
    'Верни JSON:',
    '{',
    '  "dark":  { "имя": "значение" },',
    '  "light": { "имя": "значение" }',
    '}',
    'Имен — как можно больше.',
    'Значения — в формате CSS (hex, rgba, px, em, s).',
    'Только JSON.'
  ].join('\n');

  function getCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function setCache(data){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }

  async function requestFromAI(){
    var r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: PROMPT, context: []})
    });
    var j = await r.json();
    if(!j || !j.data || !j.data.answer) throw new Error('empty');
    var txt = j.data.answer.trim();
    txt = txt.replace(/```json/gi, '').replace(/```/g, '').trim();
    var first = txt.indexOf('{');
    var last = txt.lastIndexOf('}');
    if(first < 0 || last < 0) throw new Error('no json');
    return JSON.parse(txt.slice(first, last + 1));
  }

  async function get(){
    var cached = getCache();
    if(cached) return cached;
    try{
      var fresh = await requestFromAI();
      setCache(fresh);
      return fresh;
    }catch(e){
      return {};
    }
  }

  return {
    get: get,
    getCache: getCache,
    setCache: setCache,
    PROMPT: PROMPT
  };
})();
</script>
