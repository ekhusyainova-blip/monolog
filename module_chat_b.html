<!-- Модуль: chat -->
<!-- Слой: B (условие: как связать данные и DOM, правила) -->

<script>
window.MODULE_CHAT_B = (function(){
  function whenActive(){
    // Условие активности модуля. Пока всегда true.
    return true;
  }

  // Собираем текст запроса из состояния.
  function buildPayload(text, history){
    return {
      text: text,
      context: history || []
    };
  }

  // Правила разбора ответа.
  function parseAnswer(json){
    if(!json || !json.ok){
      var msg = (json && json.error && json.error.message) || window.MODULE_CHAT_A.strings.errorGeneric;
      return { kind: 'error', text: msg };
    }
    if(!json.data || !json.data.answer){
      return { kind: 'error', text: window.MODULE_CHAT_A.strings.errorEmpty };
    }
    return { kind: 'answer', text: json.data.answer };
  }

  return { whenActive: whenActive, buildPayload: buildPayload, parseAnswer: parseAnswer };
})();
</script>
