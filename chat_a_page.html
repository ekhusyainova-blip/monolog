<!-- chat_a_page.html -->
<!-- Тема: page -->
<!-- Слой: A (данные: слоты, реестр модулей, запрос к ИИ) -->

<script>
window.PAGE_A = (function(){
  var CACHE_KEY = 'monolog_page_layout';

  // Слоты страницы. Ключ — имя, значение — что в нём может быть.
  var SLOTS = {
    header:    { label: 'Верхняя полоса' },
    leftRail:  { label: 'Левая колонка' },
    main:      { label: 'Основная область' },
    rightRail: { label: 'Правая колонка' },
    composer:  { label: 'Нижняя плашка' },
    sheet:     { label: 'Шторка' },
    overlay:   { label: 'Оверлей' },
    status:    { label: 'Статус' }
  };

  // Реестр модулей. Пока пустой — модулей нет.
  var MODULES = [];

  // Запрос к ИИ: какие блоки и в каком порядке.
  var PROMPT = [
    'Ты — сборщик страницы.',
    'Есть слоты: header, leftRail, main, rightRail, composer, sheet, overlay, status.',
    'Есть модули: ' + (MODULES.map(function(m){return m.id;}).join(', ') || '(нет)') + '.',
    'Верни JSON:',
    '{ "layout": [ { "slot": "<имя>", "module": "<id>" } ] }',
    'Только JSON.'
  ].join('\n');

  function getCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function setCache(data){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }

  async function requestFromAI(){
    if(MODULES.length === 0) return { layout: [] };
    var r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: PROMPT, context: []})
    });
    var j = await r.json();
    if(!j || !j.data || !j.data.answer) throw new Error('empty');
    var txt = j.data.answer.trim().replace(/```json/gi,'').replace(/```/g,'').trim();
    var first = txt.indexOf('{');
    var last = txt.lastIndexOf('}');
    if(first < 0 || last < 0) throw new Error('no json');
    return JSON.parse(txt.slice(first, last + 1));
  }

  async function get(){
    var cached = getCache();
    if(cached) return cached;
    try{
      var fresh = await requestFromAI();
      setCache(fresh);
      return fresh;
    }catch(e){
      return { layout: [] };
    }
  }

  return {
    get: get,
    getCache: getCache,
    setCache: setCache,
    SLOTS: SLOTS,
    MODULES: MODULES,
    PROMPT: PROMPT
  };
})();
</script>
